<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meow</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;    
        }

        img {
            max-width: 100%;  
            max-height: 100%; 
            cursor: pointer; 
        }
    </style>
</head>
<body>
    <img src="kitten.jpg" alt="Kitten" id="image">
    <audio id="clickSound" src="explosionsound.mp3" preload="auto"></audio>

    <script>
        const image = document.getElementById('image');
        const clickSound = document.getElementById('clickSound');

        // Create a function to handle the click event
        function handleClick() {
            clickSound.play(); // Play the sound when clicked

            // Change the image to the GIF
            image.src = "https://i.gifer.com/origin/d7/d7ac4f38b77abe73165d85edf2cbdb9e_w200.gif";

            image.onload = function() {
                // After the GIF has finished playing, set the image back to the original
                setTimeout(function() {
                    image.src = "kittyfisheye.jpg"; // Revert back to the original image
                }, 1200); // Wait for the duration of the GIF before changing the image
            };

            // Remove the event listener to prevent further clicks
            image.removeEventListener('click', handleClick);
        }

        // Add the event listener for the first click
        image.addEventListener('click', handleClick);
    </script>
</body>
</html>
