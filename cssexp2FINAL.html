<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dancing Divas</title>
    <style>

    * {
        margin:0;
        padding:0;
    }

    body {
            background: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

    .cig {
        position: relative;
        width: 25px;
        height: 300px;
        top: 40px; 
        left: 20px;
        box-shadow: inset 0 0 10px rgb(99, 99, 99);
        background: rgb(219, 219, 219);
        animation: cigmove 5s infinite;
    }

    .cig2 {
        position: relative;
        width: 25px;
        height: 300px;
        top: 55px; 
        left: 20px;
        box-shadow: inset 0 0 10px rgb(99, 99, 99);
        background: rgb(219, 219, 219);
        animation: cigmove2 1s infinite
    }

    .cig3 {
        position: relative;
        width: 25px;
        height: 300px;
        top: 55px; 
        left: 77px;
        box-shadow: inset 0 0 10px rgb(99, 99, 99);
        background: rgb(219, 219, 219);
        animation: cigmove 2s infinite;
    }
    
    .cig4 {
        position: relative;
        width: 25px;
        height: 300px;
        top: 30px; 
        left: 25px;
        box-shadow: inset 0 0 10px rgb(99, 99, 99);
        background: rgb(219, 219, 219);
        animation: cigmove2 15s infinite
    }

    .cig5 {
        position: relative;
        width: 25px;
        height: 300px;
        top: 30px; 
        left: -25px;
        box-shadow: inset 0 0 10px rgb(99, 99, 99);
        background: rgb(219, 219, 219);
        animation: cigmove .5s infinite;
    }

    .cig6 {
        position: relative;
        width: 25px;
        height: 300px;
        top: 30px; 
        left: -133px;
        box-shadow: inset 0 0 10px rgb(99, 99, 99);
        background: rgb(219, 219, 219);S
        animation: cigmove .5s infinite;
    }

    .cigtop {
        position: relative;
        width: 25px;
        border-radius: 50%;
        height: 10px;
        top: -5px; 
        left: 0px;
        background: rgb(219, 219, 219);
        z-index: 3;
    }
    
    .cigbutt {
        position: relative;
        width: 25px;
        height: 90px;
        top: -10px; 
        z-index: 2;
        box-shadow: inset 0 5px 10px  rgb(115, 85, 26);
        background: rgb(202, 125, 48);
    }

    .cigbuttbottom {
        position: relative;
        width: 25px;
        border-radius: 50%;
        height: 10px;
        top: -15px; 
        left: 0px;
        background: rgb(202, 125, 48);
        box-shadow: inset 0px 0px 6.5px rgb(115, 85, 26);
        z-index: 1;
    }

    .cigboxfront {
        position: absolute;
        justify-content: center;
        top: 180px;
        width: 190px;
        height: 220px;
        background-image: url('marlboropack.jpg'); /* Replace with your image path */
        background-size: cover; /* Ensure the image covers the whole box */
        background-position: center; /* Center the image inside the box */
        z-index: 1; /* Lower z-index so that left and right sections are behind it */
    }


    .cigboxfrontleft {
        position: relative;
        width: 0;
        height: 0;
        top: -45px;
        border-bottom: 45px solid rgb(255, 255, 255);
        border-right: 35px solid transparent;
        z-index: -1; /* Ensure this element appears behind .cigboxfront */
    }

    .cigboxfrontright {
        position: relative;
        width: 0;
        height: 0;
        top: -90px;
        left: 155px;
        border-bottom: 45px solid rgb(255, 255, 255);
        border-left: 35px solid transparent;
        z-index: -1; /* Ensure this element appears behind .cigboxfront */
    }

    .cigboxfrontfront {
        position: absolute;
        justify-content: center;
        top: -10px;
        width: 190px;
        height: 10px;
        background-color: white;
        z-index: 1; /* Lower z-index so that left and right sections are behind it */
    }

    .cigboxlid {
        position: absolute;
        justify-content: center;
        top: 100px;
        width: 190px;
        height: 100px;
        background-color: rgb(232, 232, 232);
        z-index: -1; /* Lower z-index so that left and right sections are behind it */
    }

    .cigboxlidtop {
        position: absolute;
        justify-content: center;
        top: -10px;
        width: 190px;
        height: 15px;
        background-color: rgb(240, 0, 25);
        z-index: 1; /* Lower z-index so that left and right sections are behind it */
    }

    .cigtopfrontright {
        position: relative;
        width: 0;
        height: 0;
        top: -85px;
        left: 160px;
        border-top: 45px solid lightblue;
        border-left: 30px solid transparent;
        z-index: 1; /* Ensure this element appears behind .cigboxfront */
    }
    .cigtopfrontleft {
        position: relative;
        width: 0;
        height: 0;
        top: -40px;
        border-top: 45px solid lightblue;
        border-right: 30px solid transparent;
        z-index: 1; /* Ensure this element appears behind .cigboxfront */
    }

    @keyframes cigmove {
            0% {
                top: 60px;
            }
            50% {
                top: 25px;
            }
            100% {
                top: 60px;
            }
        }

    @keyframes cigmove2 {
            0% {
                top: 50px;
            }
            50% {
                top: 25px;
            }
            100% {
                top: 50px;
            }
        }

    </style>
</head>
<body>
    <div class="cigboxlid">
        <div class="cigboxlidtop"></div>
        <div class="cigtopfrontleft"></div>
        <div class="cigtopfrontright"></div>
    </div>
    <div class="cigboxfront">
        <div class="cigboxfrontleft"></div>
        <div class="cigboxfrontright"></div>
        <div class="cigboxfrontfront"></div>
    </div>
    <div class="cig">
        <div class="cigtop"></div>
        <div class="cigbutt"></div>
        <div class="cigbuttbottom"></div>
    </div>
    <div class="cig2">
        <div class="cigtop"></div>
        <div class="cigbutt"></div>
        <div class="cigbuttbottom"></div>
    </div>
    <div class="cig3">
        <div class="cigtop"></div>
        <div class="cigbutt"></div>
        <div class="cigbuttbottom"></div>
    </div>
    <div class="cig4">
        <div class="cigtop"></div>
        <div class="cigbutt"></div>
        <div class="cigbuttbottom"></div>
    </div>
    <div class="cig5">
        <div class="cigtop"></div>
        <div class="cigbutt"></div>
        <div class="cigbuttbottom"></div>
    </div>
    <div class="cig6">
        <div class="cigtop"></div>
        <div class="cigbutt"></div>
        <div class="cigbuttbottom"></div>
    </div>

</body>
</html>
