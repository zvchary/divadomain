<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Experiment 1</title>
    <style>
* {
    margin:0;
    padding: 0;
    box-sizing: border-box;
}

.typeset {
    font-family:Arial, Helvetica, sans-serif;
    color: red;
    text-align: center;
    font-size: xx-large; 
}

.typeset2 {
    background-color: rgb(251, 255, 0);
    font-family:cursive;
    color: blue;
    text-align: center;
    padding: 10px;
    border-radius: 200px;
}

.typeset3 {
    background: linear-gradient(90deg, rgb(255, 0, 0), blue);
    font-size: 80px;
    text-align: center;
    letter-spacing: 2px;
    text-shadow: 10px 10px black;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
    </style>
</head>
<body>
    <div class="typeset">vcufarts</div>
    <div class="typeset2">Grafix Design</div>
    <div class="typeset3">I Hart Graphic Design</div>
</body>
</html>
