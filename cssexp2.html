<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        * {
            margin:0;
            padding:0;
        }

        body {
            background: lightblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .head {
            position: relative;
            width: 500px;
            height: 500px;
            background: bisque;
            border-radius: 60% 60% 70% 70%;
            box-shadow: inset 0 0 10px orange;
            animation: embarrassed 10s infinite
        }

        .hair {
            position: absolute;
            width: 500px;
            height: 200px;
            background: rgb(225, 121, 16);
            top: px;
            border-radius: 1000% 1000% 0 0;
            z-index: 2;
        }

        .eye-left {
            position: absolute;
            width: 50px;
            height: 50px;
            background: white;
            top: 200px;
            left: 100px;
            border-radius: 50%;
            z-index: 1;
        }

        .eye-right {
            position: absolute;
            width: 50px;
            height: 50px;
            background: white;
            top: 200px;
            right: 100px;
            border-radius: 50%;
            z-index: 1;
        }

        .iris-left {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgb(98, 68, 41);
            top: 15px;
            left: 15px;
            border-radius: 50%;
            z-index: 2;
        }

        .iris-right {
            position: absolute;
            width: 20px;
            height: 20px;
            background: rgb(98, 68, 41);
            top: 15px;
            right: 15px;
            border-radius: 50%;
            z-index: 2;
            animation: rukiddingme 5s infinite
        }

        .nose {
            position: absolute;
            width: 30px;
            height: 50px;
            background: bisque;
            border-radius: 50%;
            border-bottom: 5px solid;
            top: 250px;
            left: 230px;
            animation: embarrassed 10s infinite
        }

        .mouth {
            position: absolute;
            width: 80px;
            height: 30px;
            background: bisque;
            border-radius: 50%;
            border-bottom: 5px solid rgb(133, 22, 12);
            top: 350px;
            left: 205px;
            animation: embarrassed 10s infinite
        }

        @keyframes embarrassed {
            0% {
                background-color: bisque;
            }
            50% {
                background-color: red;
            }
            100% {
                background-color: bisque;
            }
        }

        @keyframes rukiddingme {
            0% {
                left: 15px;
            }
            50% {
                right: 30px;
            }
            100% {
                left: 15px;
            }
        }
        
    </style>
</head>
<body>
    <div class="head">
        <div class="nose"></div>
        <div class="eye-left">
            <div class="iris-left"></div>
        </div>
        <div class="eye-right">
            <div class="iris-right"></div>
        </div>
        <div class="hair"></div>
        <div class="mouth"></div>
    </div>
</body>
</html>
