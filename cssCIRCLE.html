<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cssCIRCLE</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: blue;
            font-family:Arial, Helvetica, sans-serif;
            text-align: center;

        }

        .box1 {
            position: relative;
            width: 400px;
            height: 400px;
            background-color: rgb(18, 147, 29);
            border: 10px dotted rgb(38, 255, 0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box2 {
            position:absolute;
            width: 100px;
            height: 100px;
            top: 130px;
            left: 0 px;
            background-color: red;
            border: 5px dotted black;
            border-radius: 50%;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
   <div class="box1">
    <div class="box2">Lady bug</div>
   </div> 
</body>
</html>
